name: Start fresh Umami on existing free InstaBox
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/start-fresh-umami.yml'
      - 'scripts/start-fresh-umami.mjs'
permissions:
  contents: read
concurrency:
  group: founder-skill-mcp-instabox
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate preparation script
        run: node --check scripts/start-fresh-umami.mjs
      - name: Initialize and secure fresh Umami
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: node scripts/start-fresh-umami.mjs
